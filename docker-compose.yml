services:
  api:
    build:
      context: ..
      dockerfile: reconix-cloud/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: reconix-cloud/Dockerfile
    env_file: .env
    entrypoint: ["/usr/local/bin/reconix-cloud-worker"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconix
      POSTGRES_USER: reconix
      POSTGRES_PASSWORD: reconix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconix -d reconix"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
